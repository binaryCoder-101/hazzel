name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: pytest -q
      # Coverage is reported once, on the newest interpreter, so the job log
      # carries a single summary instead of four identical ones. Report-only:
      # there is no fail-under gate, because the low-coverage modules are the
      # provider HTTP wrappers that are mocked by design, and a threshold would
      # either be meaningless or invite padding tests for no behaviour.
      - name: Coverage report
        if: matrix.python-version == '3.13'
        run: pytest -q --cov=hazzel --cov-report=term-missing:skip-covered --cov-report=html
      - name: Upload coverage HTML
        if: matrix.python-version == '3.13'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-html
          path: htmlcov/
          if-no-files-found: ignore
          retention-days: 14
